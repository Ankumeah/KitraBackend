name: flake8

on: [ push, pull_request ]

jobs:
  flake8:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.14" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: pip install -r kitra_backend/requirements-dev.txt

      - name: Run flake8
        working-directory: kitra_backend/
        run: flake8
